{% extends "base.html" %}

{% block title %}{{ heading }} - time_tracker{% endblock %}

{% block content %}
    <h2>{{ heading }}</h2>

    <form method="post" action="{{ form_action }}" class="entry-form">
        <label for="entry_date">Date</label>
        <input
            type="date"
            id="entry_date"
            name="entry_date"
            value="{{ entry['entry_date'] if entry else '' }}"
            required
        >

        <label for="duration_minutes">Duration (minutes)</label>
        <input
            type="number"
            id="duration_minutes"
            name="duration_minutes"
            min="1"
            step="1"
            value="{{ entry['duration_minutes'] if entry else '' }}"
            required
        >

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="" {% if not entry or not entry['category'] %}selected{% endif %}>
                -- Select a category --
            </option>
            {% for category in categories %}
                <option
                    value="{{ category }}"
                    {% if entry and entry['category'] == category %}selected{% endif %}
                >
                    {{ category }}
                </option>
            {% endfor %}
        </select>

        <label for="subcategory">Subcategory (optional)</label>
        <select id="subcategory" name="subcategory">
            <option value="">-- None --</option>
        </select>

        <label for="description">Description (optional)</label>
        <textarea
            id="description"
            name="description"
            rows="3"
        >{{ entry['description'] if entry and entry['description'] else '' }}</textarea>

        <label for="start_time">Start time (optional)</label>
        <input
            type="time"
            id="start_time"
            name="start_time"
            value="{{ entry['start_time'] if entry and entry['start_time'] else '' }}"
        >

        <label for="end_time">End time (optional)</label>
        <input
            type="time"
            id="end_time"
            name="end_time"
            value="{{ entry['end_time'] if entry and entry['end_time'] else '' }}"
        >

        <button type="submit" class="button">Save</button>
        <a href="{{ url_for('index') }}" class="button button-secondary">Cancel</a>
    </form>

    <script>
        // Category -> subcategory mapping, rendered server-side from
        // app/categories.py so there is a single source of truth.
        const categoriesMap = {{ categories_map | tojson }};
        const currentSubcategory = "{{ entry['subcategory'] if entry and entry['subcategory'] else '' }}";

        const categorySelect = document.getElementById("category");
        const subcategorySelect = document.getElementById("subcategory");

        function populateSubcategories(selectedCategory, preselect) {
            subcategorySelect.innerHTML = '<option value="">-- None --</option>';
            const subcategories = categoriesMap[selectedCategory] || [];
            for (const sub of subcategories) {
                const option = document.createElement("option");
                option.value = sub;
                option.textContent = sub;
                if (sub === preselect) {
                    option.selected = true;
                }
                subcategorySelect.appendChild(option);
            }
        }

        categorySelect.addEventListener("change", () => {
            populateSubcategories(categorySelect.value, "");
        });

        // On initial page load (e.g. editing an existing entry), populate
        // the subcategory list for the already-selected category.
        populateSubcategories(categorySelect.value, currentSubcategory);
    </script>
{% endblock %}
